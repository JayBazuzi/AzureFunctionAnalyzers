name: Build and Test

on:
  push:
  pull_request:
  schedule:
    - cron: '17 7 * * 0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: ./build_and_test.cmd
